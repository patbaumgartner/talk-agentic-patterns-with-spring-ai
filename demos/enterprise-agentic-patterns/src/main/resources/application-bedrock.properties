spring.ai.model.chat=bedrock-converse

# Claude 5.5 models need cross-region inference profile ids ("eu.", "us.", "global.").
spring.ai.bedrock.aws.region=${AWS_REGION:eu-central-1}
spring.ai.bedrock.aws.timeout=PT3M
spring.ai.bedrock.converse.chat.model=${BEDROCK_MODEL_ID:${agentic.models.smart}}

agentic.models.fast=${AGENTIC_MODEL_FAST:eu.anthropic.claude-haiku-5-5}
agentic.models.smart=${AGENTIC_MODEL_SMART:eu.anthropic.claude-opus-5-5}
agentic.models.judge=${AGENTIC_MODEL_JUDGE:eu.anthropic.claude-haiku-5-5}
# Claude 5.5 on Bedrock rejects the temperature parameter, so no tier sends one.
agentic.temperature-supported=false
