spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${agentic.models.smart}
# Pull every configured tier explicitly before the demo; startup must work offline.
spring.ai.ollama.init.pull-model-strategy=when_missing

agentic.models.fast=${AGENTIC_MODEL_FAST:qwen3:8b}
agentic.models.smart=${AGENTIC_MODEL_SMART:qwen3:14b}
agentic.models.judge=${AGENTIC_MODEL_JUDGE:qwen3:8b}
