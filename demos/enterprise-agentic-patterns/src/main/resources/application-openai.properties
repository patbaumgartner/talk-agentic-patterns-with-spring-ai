spring.ai.model.chat=openai
spring.ai.openai.api-key=${OPENAI_API_KEY}
# Base URL: Spring AI defaults to https://api.openai.com/v1 and reads OPENAI_BASE_URL itself.
spring.ai.openai.chat.model=${agentic.models.smart}

agentic.models.fast=${AGENTIC_MODEL_FAST:gpt-4.1-mini}
agentic.models.smart=${AGENTIC_MODEL_SMART:gpt-4.1}
agentic.models.judge=${AGENTIC_MODEL_JUDGE:gpt-4.1-mini}
