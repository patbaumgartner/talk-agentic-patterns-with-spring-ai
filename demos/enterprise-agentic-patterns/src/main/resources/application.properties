spring.application.name=enterprise-agentic-patterns

# Activate exactly one provider profile: bedrock, openai, anthropic, ollama.
spring.profiles.default=bedrock
spring.ai.model.chat=none

# These demos use chat and tools only. Do not initialize other provider clients.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

# --- Guardrails ------------------------------------------------------------
agentic.limits.max-tokens=4096
agentic.limits.max-parallel-calls=4
agentic.limits.max-evaluation-rounds=3
agentic.limits.max-handoffs=8

# --- Server / observability ------------------------------------------------
server.port=${PORT:8080}
# Loopback by default; set SERVER_ADDRESS to widen the bind on purpose.
server.address=${SERVER_ADDRESS:127.0.0.1}
# Demo app: surface the root cause (e.g. provider auth/quota errors) in the UI error dialog.
spring.web.error.include-message=always

spring.threads.virtual.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.observations.key-values.application=${spring.application.name}

logging.level.com.fortytwotalents=DEBUG
logging.level.org.springframework.ai=INFO

# Set to DEBUG to print every prompt and response (SimpleLoggerAdvisor).
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=INFO
